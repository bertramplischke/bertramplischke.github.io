<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Danke – Pawliday</title>
<style>
  :root { --terra: #B4531F; --gruen: #1E5631; --bg: #fffaf4; --text: #2b2118; --muted: #5f4f41; --panel: #F3E3CF; --rand: #cdb59a; }
  @media (prefers-color-scheme: dark) {
    :root { --terra: #e8925f; --gruen: #2f7a47; --bg: #1b1713; --text: #f3e9df; --muted: #cdbdad; --panel: #2a211a; --rand: #6b5744; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 1.1rem;
    background: var(--bg); color: var(--text); line-height: 1.55;
  }
  a { color: var(--terra); }
  a:focus-visible { outline: 3px solid var(--terra); outline-offset: 2px; }
  main { max-width: 42rem; margin: 0 auto; padding: 2rem 1rem; }
  h1 { font-size: 1.7rem; line-height: 1.25; margin: 0 0 .75rem; }
  p { overflow-wrap: anywhere; }
  .box { background: var(--panel); border: 1px solid var(--rand); border-left: 4px solid var(--terra); border-radius: 8px; padding: .9rem 1rem; margin: 1rem 0; }
  footer { margin-top: 2.5rem; padding-top: 1rem; border-top: 1px solid var(--rand); font-size: .95rem; color: var(--muted); }
  footer p { margin: .3rem 0; }
</style>
</head>

  <p>Fragen? <a href="mailto:apps@bertramplischke.de">apps@bertramplischke.de</a></p>

</html>
